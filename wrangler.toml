# wrangler.toml
name = "uk-serverlink"                # আপনার Worker-এর নাম (যা dashboard-এ দেখাবে)
main = "src/index.js"                 # মূল কোড ফাইলের পাথ
compatibility_date = "2024-12-18"     # সাম্প্রতিক কোনো তারিখ দিন
workers_dev = true                    # true রাখলে workers.dev সাবডোমেইন পাবেন

# [vars] প্রয়োজন হলে এখানে environment variable বসাতে পারেন
# [vars]
# UPSTREAM_BASE = "https://..."
